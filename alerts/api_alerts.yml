groups:
  - name: api.alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(demo_http_requests_total{status=~"5.."}[2m]))
          /
          sum(rate(demo_http_requests_total[2m]))
          > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on demo-api"
          description: "The error rate of demo-api is above 5% for more than 2 minutes."
